<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Workout Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('/static/images/gym-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #1a1a1a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #2563eb;
        }
        .admin-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }
        .admin-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💪 FitBuddy - AI Workout Generator</h2>
        <form action="/generate-workout" method="POST">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" name="username" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label>User ID:</label>
                <input type="number" name="user_id" placeholder="e.g. 101" required>
            </div>
            <div class="form-group">
                <label>Age:</label>
                <input type="number" name="age" placeholder="e.g. 25" required>
            </div>
            <div class="form-group">
                <label>Weight (kg):</label>
                <input type="number" step="0.1" name="weight" placeholder="e.g. 70.5" required>
            </div>
            <div class="form-group">
                <label>Fitness Goal:</label>
                <input type="text" name="goal" placeholder="e.g., weight loss, muscle gain" required>
            </div>
            <div class="form-group">
                <label>Workout Intensity:</label>
                <select name="intensity" required>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <button type="submit">Generate Plan</button>
        </form>
        <a href="/view-all-users" class="admin-link">View Admin Dashboard</a>
    </div>
</body>
</html>
